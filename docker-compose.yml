services:
  # Ollama service with GPU support (NVIDIA T4)
  ollama:
    image: ollama/ollama:latest
    container_name: cdd-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Health check using wget (available in Ollama image)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Main application (Streamlit web app)
  cdd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdd-app
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "8501:8501"  # Expose Streamlit port
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Optional: Mount project directories if needed
      - ./project_to_analyze:/app/project_to_analyze:ro
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ollama_data:
