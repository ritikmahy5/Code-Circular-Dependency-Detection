pattern_id: proxy_pattern
title: Use Proxy for Deferred Dependency Resolution
anti_pattern: circular_dependency
refactoring_strategy: proxy
complexity: medium
framework: generic

problem_description: |
  A class needs a reference to another class at construction time,
  but that class isn't available yet due to circular imports.
  A proxy can stand in until the real object is available.

symptoms:
  - Need object reference before it's importable
  - Circular dependency during initialization
  - Object not used until later in execution
  - Want to defer resolution

solution_description: |
  Create a proxy object that defers the actual import/lookup
  until the proxied object is actually used. The proxy forwards
  all attribute access and method calls to the real object.

before_code: |
  # client.py
  from server import Server  # Circular!
  
  class Client:
      def __init__(self):
          self.server = Server()  # Needs Server immediately
      
      def send(self, data):
          return self.server.receive(data)
  
  # server.py
  from client import Client  # Circular!
  
  class Server:
      def __init__(self):
          self.clients = []

after_code: |
  # proxy.py
  class LazyProxy:
      """Proxy that defers import until first use."""
      
      def __init__(self, module_path, class_name):
          self._module_path = module_path
          self._class_name = class_name
          self._instance = None
      
      def _load(self):
          if self._instance is None:
              import importlib
              module = importlib.import_module(self._module_path)
              cls = getattr(module, self._class_name)
              self._instance = cls()
          return self._instance
      
      def __getattr__(self, name):
          return getattr(self._load(), name)
      
      def __call__(self, *args, **kwargs):
          return self._load()(*args, **kwargs)
  
  # client.py (no direct import)
  from proxy import LazyProxy
  
  class Client:
      def __init__(self):
          self.server = LazyProxy('server', 'Server')
      
      def send(self, data):
          # Server is imported here, when actually needed
          return self.server.receive(data)
  
  # server.py (no circular import needed)
  class Server:
      def __init__(self):
          self.clients = []
      
      def receive(self, data):
          return f"Received: {data}"

step_by_step:
  - Create a LazyProxy class
  - Replace direct imports with proxy creation
  - Proxy loads real object on first attribute access
  - Test that behavior is unchanged
  - Consider caching the loaded instance

when_to_use:
  - Dependency not needed until runtime
  - Breaking initialization-time cycles
  - Want transparent lazy loading
  - Building plugin systems

when_not_to_use:
  - Need type checking at import time
  - Proxy overhead is unacceptable
  - Direct reference is required

keywords:
  - proxy
  - lazy proxy
  - deferred loading
  - virtual proxy
  - forwarding
